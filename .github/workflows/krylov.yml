name: Krylov application and browser lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pytest -r requirements-ckks.txt
      # These standalone NumPy tests do not use the legacy Cora fixtures.
      - run: python -m pytest --noconftest -q tests/test_krylov.py
      - run: python -m applications.krylov --backend plain --degree 2 --output /tmp/krylov-plain.json
      - run: python -m applications.krylov --backend ckks --degree 2 --output /tmp/krylov-ckks.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: krylov-browser-lab
          path: dist
